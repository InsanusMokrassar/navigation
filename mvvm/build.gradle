plugins {
    id "org.jetbrains.kotlin.multiplatform"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.android.kotlin.multiplatform.library"
    alias(libs.plugins.compose)
    alias(libs.plugins.kt.jb.compose)
}

apply from: "$mppProjectWithSerialization"
apply from: "$mpp_publish"

kotlin {
    android {
        compilations.withType(com.android.build.api.dsl.KotlinMultiplatformAndroidDeviceTestCompilation) {
            instrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                api project(":navigation.core")
                api project(":navigation.compose")
                api libs.microutils.coroutines.compose
                api libs.microutils.koin
                api libs.koin.core
                api compose.runtime
            }
        }

        jsMain {
            dependencies {
                api compose.web.core
                api compose.web.svg
            }
        }

        androidMain {
            dependencies {
                api compose.ui
                api compose.foundation
                api libs.koin.android
            }
        }
    }
}
